# Project-wide Gradle settings per Eversense-Reader (Esel)
# Configurazione OTTIMIZZATA per i9-12900KS + 32GB RAM

# --- 1. PRESTAZIONI CPU (Il motore) ---
# Attiva il parallelismo (sfrutta i tuoi core)
org.gradle.parallel=true
# Usa la cache per non ricompilare cose già fatte
org.gradle.caching=true
# Daemon sempre attivo per risposta immediata
org.gradle.daemon=true
# Configura solo i moduli necessari (ottimo per progetti piccoli)
org.gradle.configureondemand=true

# --- 2. MEMORIA RAM (Il carburante) ---
# -Xmx4g: 4GB sono perfetti per questo progetto (1.5GB erano troppo pochi!)
# -XX:+UseParallelGC: Usa tutti i core per pulire la RAM all'istante
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# --- 3. NUMERO DI OPERAI ---
# Usiamo 16 thread del tuo processore.
org.gradle.workers.max=16

# --- 4. COMPILATORE KOTLIN ---
# Gli diamo un po' più di respiro (1.5GB dedicato)
kotlin.daemon.jvm.options=-Xmx1536m

# --- 5. IMPOSTAZIONI ANDROID (Modernizzazione) ---
# Usiamo le nuove librerie AndroidX
android.useAndroidX=true
# FALSE = Velocità. Mettilo a true SOLO se la compilazione fallisce con errori su "support libraries".
android.enableJetifier=false
# Velocizza la creazione delle risorse R
android.nonTransitiveRClass=true
# Evita conflitti di nomi pacchetti
android.uniquePackageNames=true