// ---------- CODICE CON SDK TARGET ABBASSATO E WORKMANAGER ----------
apply plugin: 'com.android.application'

android {
    compileSdk 35
    defaultConfig {
        applicationId "esel.esel.esel"
        minSdk 30
        targetSdk 30
        versionCode 1
        versionName "v1.0 by Chiariello Francesco"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'esel.esel.esel'

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Aggiunto per ignorare l'errore sul targetSdk, che è una scelta voluta.
    lintOptions {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Versioni originali e stabili
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.13.1'

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Dipendenza per WorkManager (la nostra "pattuglia di riserva")
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Dipendenze per i test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}